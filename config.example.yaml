# -----------------------------------------------------------------------------
# LinuxCNC Status Monitor — agent configuration
# -----------------------------------------------------------------------------
# Location: ~/linuxcnc-monitor-agent/config.yaml
#   Created automatically the first time the agent runs. Package upgrades
#   never overwrite it.
#
# After editing, apply the change with:
#   systemctl --user restart lcnc-status-agent
#
# Check what the agent will do (config file, name, where packets go):
#   lcnc-status-agent --check
#
# Missing keys fall back to the defaults shown here; unknown keys are ignored.
# Keep the file flat (no nested/indented structures).
# -----------------------------------------------------------------------------

# Where to send the status stream. Comma-separated list of:
#   auto            broadcast on the local network (recommended) — every
#                   dashboard on the same LAN / Wi-Fi receives it, whatever its
#                   IP is. No static IP needed, nothing to change when the
#                   monitoring PC's address changes.
#   192.168.0.50    a fixed IP (only if broadcast is blocked on your network)
#   office-pc.local a host name, looked up again every 30 s
monitor_pc_ip: "auto"

# UDP port the dashboard listens on.
monitor_pc_port: 5005

# Network interfaces never to broadcast on, comma-separated (e.g. "enp3s0").
# The Mesa hm2_eth card's interface is detected and skipped automatically.
exclude_interfaces: ""

# Name shown in the dashboard. Empty = this PC's hostname.
# Example: "VMC-01" or "Router-Bay-3". Must be unique per machine.
machine_name: ""

# Seconds between status packets while the machine is active. 1.0 is typical.
poll_interval_s: 1.0

# Seconds between LinuxCNC status reads used for cycle / part tracking.
# Faster than poll_interval_s so the last move before M2/M30 is never missed.
sample_interval_s: 0.1

# Seconds between keep-alive packets while the machine is idle.
idle_heartbeat_interval_s: 30.0

# Bytes per chunk when streaming the loaded G-code file (kept under the UDP limit).
gcode_chunk_size: 50000

# Log file path (only written in dev mode: lcnc-status-agent --dev).
log_file: "/tmp/cnc_status.log"

# History kept on this PC (~/linuxcnc-monitor-agent/journal.db) so the
# dashboard can fetch what it missed while it was closed, the office PC was
# off, or the network was down. About 1 MB per day of production.
journal_days: 14
journal_interval_s: 10      # journal at least this often while running
journal_port: 5006          # UDP port the dashboard asks for history on (0 = off)

# Rotating log settings (dev mode only).
log_max_bytes: 5242880   # 5 MiB
log_backup_count: 3
