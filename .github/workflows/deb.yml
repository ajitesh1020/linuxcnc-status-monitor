name: Debian package

# PRs / manual runs: test + build the .deb as a downloadable artifact.
# Tag vX.Y.Z:        same, then publish it on the GitHub Release for that tag.
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Read-only by default; only the publish job (tags) may write the release.
permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Tag matches AGENT_VERSION
        if: github.ref_type == 'tag'
        run: |
          src=$(sed -n 's/^AGENT_VERSION: str = "\(.*\)"/\1/p' status.py)
          [ "v$src" = "$GITHUB_REF_NAME" ] || {
            echo "::error::tag $GITHUB_REF_NAME but status.py AGENT_VERSION is $src"; exit 1; }

      - name: Build
        run: bash packaging/deb/build.sh

      - name: Inspect
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Install / remove smoke test
        run: |
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/lcnc-status-agent
          test -f /usr/lib/systemd/user/lcnc-status-agent.service
          systemctl --global is-enabled lcnc-status-agent.service
          python3 -c 'import ast,sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]' \
            /usr/share/linuxcnc-status-agent/*.py
          cat /usr/share/linuxcnc-status-agent/config.example.yaml > /dev/null
          sudo apt-get remove -y linuxcnc-status-agent
          ! systemctl --global is-enabled lcnc-status-agent.service

      - name: Checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linuxcnc-status-agent-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS

  publish:
    # A published release is never replaced: re-running a tag fails rather
    # than swapping the package people may already have checked.
    if: github.ref_type == 'tag'
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linuxcnc-status-agent-deb
          path: dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist && sha256sum -c SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists; not replacing it"; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" *.deb SHA256SUMS \
            --title "linuxcnc-status-agent $GITHUB_REF_NAME" --generate-notes
